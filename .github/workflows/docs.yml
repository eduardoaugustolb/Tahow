name: Documentation
on:
  push:
    branches: [main]
    paths: ['package.json', 'bun.lock', 'website/**', '.github/workflows/docs.yml']
  pull_request:
    paths: ['package.json', 'bun.lock', 'website/**', '.github/workflows/docs.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - run: bun install --frozen-lockfile
      - run: bun run build
        working-directory: website
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/dist
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
